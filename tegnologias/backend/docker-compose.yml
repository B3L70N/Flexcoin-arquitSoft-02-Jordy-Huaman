services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quillacoin
      POSTGRES_USER: quilla
      POSTGRES_PASSWORD: quilla
    ports:
      - "5432:5432"
    volumes:
      - quillacoin-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quilla -d quillacoin"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  quillacoin-postgres:
